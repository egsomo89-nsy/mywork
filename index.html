<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Code 학습 가이드</title>
  <meta name="description" content="초보자를 위한 Claude Code 단계별 학습 사이트 (설치, 실전 활용, 확장 기능, 실무 적용)">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="menu-btn" type="button" aria-label="목차 열기" aria-controls="sidebar" aria-expanded="false">목차</button>
    <a class="brand" href="#">Claude Code 학습 가이드</a>
    <div class="progress" title="학습 진행률">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <span id="progress-text"></span>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="학습 목차"></nav>
    <main id="content" class="content" tabindex="-1">
      <noscript>이 사이트는 자바스크립트가 켜져 있어야 동작합니다.</noscript>
    </main>
  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
